name: Generate Pokémon Set Sheets from List

on:
  schedule:
    - cron: "0 12 * * *" # Runs daily at 12:00 UTC
  workflow_dispatch:

jobs:
  generate-sheets:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3 # Limits concurrent pushes to prevent git branch lockouts
      matrix:
        set:
          # --- MASTER SET LIST ---
          - set_url_name: 'sv01-scarlet-and-violet-base-set'
            set_filter_name: 'Scarlet'
            set_display_name: 'SV01: Scarlet & Violet Base Set'

          - set_url_name: 'sv02-paldea-evolved'
            set_filter_name: 'Paldea'
            set_display_name: 'SV02: Paldea Evolved'

          - set_url_name: 'sv03-obsidian-flames'
            set_filter_name: 'Obsidian'
            set_display_name: 'SV03: Obsidian Flames'

          - set_url_name: 'sv-scarlet-and-violet-151'
            set_filter_name: '151'
            set_display_name: 'SV3.5: Scarlet & Violet 151'

          - set_url_name: 'sv04-paradox-rift'
            set_filter_name: 'Paradox'
            set_display_name: 'SV04: Paradox Rift'

          - set_url_name: 'sv-paldean-fates'
            set_filter_name: 'Paldean'
            set_display_name: 'SV4.5: Paldean Fates'

          - set_url_name: 'sv05-temporal-forces'
            set_filter_name: 'Temporal'
            set_display_name: 'SV05: Temporal Forces'

          - set_url_name: 'sv06-twilight-masquerade'
            set_filter_name: 'Twilight'
            set_display_name: 'SV06: Twilight Masquerade'

          - set_url_name: 'sv09-shrouded-fable'
            set_filter_name: 'Shrouded'
            set_display_name: 'SV6.5: Shrouded Fable'

          - set_url_name: 'sv07-stellar-crown'
            set_filter_name: 'Stellar'
            set_display_name: 'SV07: Stellar Crown'

          - set_url_name: 'sv08-surging-sparks'
            set_filter_name: 'Surging'
            set_display_name: 'SV08: Surging Sparks'

          - set_url_name: 'sv-prismatic-evolutions'
            set_filter_name: 'Prismatic'
            set_display_name: 'SV8.5: Prismatic Evolutions'

          - set_url_name: 'sv09-journey-together'
            set_filter_name: 'Journey'
            set_display_name: 'SV09: Journey Together'

          - set_url_name: 'sv10-destined-rivals'
            set_filter_name: 'Destined'
            set_display_name: 'SV10: Destined Rivals'

          - set_url_name: 'sv-black-bolt'
            set_filter_name: 'Black'
            set_display_name: 'SV: Black Bolt'

          - set_url_name: 'sv-white-flare'
            set_filter_name: 'White'
            set_display_name: 'SV: White Flare'

          # --- MEGA EVOLUTION SERIES ---
          - set_url_name: 'me01-mega-evolution'
            set_filter_name: 'Mega'
            set_display_name: 'ME01: Mega Evolution'

          - set_url_name: 'me02-phantasmal-flames'
            set_filter_name: 'Phantasmal'
            set_display_name: 'ME02: Phantasmal Flames'

          - set_url_name: 'me-ascended-heroes'
            set_filter_name: 'Ascended'
            set_display_name: 'ME: Ascended Heroes'

          - set_url_name: 'me03-perfect-order'
            set_filter_name: 'Perfect'
            set_display_name: 'ME03: Perfect Order'

          - set_url_name: 'me04-chaos-rising'
            set_filter_name: 'Chaos'
            set_display_name: 'ME04: Chaos Rising'

          - set_url_name: 'me05-pitch-black'
            set_filter_name: 'Pitch'
            set_display_name: 'ME05: Pitch Black'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies and Browsers
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 Pillow fpdf2 replicate playwright
          python -m playwright install --with-deps

      - name: Scrape TCGplayer Data for ${{ matrix.set.set_display_name }}
        env:
          SET_URL_NAME: ${{ matrix.set.set_url_name }}
          SET_FILTER_NAME: ${{ matrix.set.set_filter_name }}
        run: |
          python << 'EOF'
          import pandas as pd
          from bs4 import BeautifulSoup
          import re
          from playwright.sync_api import sync_playwright
          import time
          import os

          set_url_name = os.environ.get('SET_URL_NAME')
          TARGET_SET_NAME = os.environ.get('SET_FILTER_NAME')

          # Set pageSize=72 for maximum items per page supported by TCGplayer
          BASE_URL = f"https://www.tcgplayer.com/search/pokemon/{set_url_name}?productLineName=pokemon&setName={set_url_name}&productTypeName=Cards&view=grid&pageSize=72"
          CSV_FILENAME = f"{set_url_name}.csv"

          all_cards_list = []
          page_number = 1

          print(f"Starting scraper for set '{set_url_name}' (Filter: '{TARGET_SET_NAME}')...")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1920, "height": 1080})

              while True:
                  if page_number > 20:
                      print(f"Reached max safety page limit for {set_url_name}. Ending scrape.")
                      break

                  paginated_url = f"{BASE_URL}&page={page_number}"
                  print(f"Scraping URL: {paginated_url}")

                  try:
                      page.goto(paginated_url, wait_until="networkidle", timeout=60000)
                      time.sleep(2)

                      # Scroll page to trigger lazy loading of images
                      for _ in range(8):
                          page.mouse.wheel(0, 800)
                          time.sleep(0.2)
                      time.sleep(1.5)

                      html_content = page.content()
                  except Exception as e:
                      print(f"Browser operation failed on page {page_number}: {e}")
                      break

                  soup = BeautifulSoup(html_content, "html.parser")
                  search_results = soup.find_all("div", class_="search-result")

                  if not search_results:
                      print(f"No search results found on page {page_number}. Ending scrape.")
                      break

                  matched_in_page = 0
                  for card in search_results:
                      card_text = card.get_text()

                      if TARGET_SET_NAME.lower() not in card_text.lower():
                          continue

                      name_tag = card.find("span", class_="product-card__title")
                      price_tag = card.find("span", class_="product-card__market-price--value")
                      image_tag = card.find("img")
                      link_tag = card.find("a", href=True)

                      raw_name = name_tag.text.strip() if name_tag else None
                      if not raw_name:
                          continue

                      product_link = link_tag['href'] if link_tag else f"{raw_name}_{page_number}_{matched_in_page}"

                      price_text = price_tag.text.strip() if price_tag else "$0.00"
                      price_match = re.search(r'\$([\d,]+\.\d{2})', price_text)
                      price = float(price_match.group(1).replace(",", "")) if price_match else 0.0

                      # Extract set number (e.g. 088/091) from card text
                      card_num = 999999
                      num_str = None

                      num_match = re.search(r'(\d{1,4})\s*/\s*(\d{1,4})', card_text)
                      if num_match:
                          num_str = num_match.group(0)
                          card_num = int(num_match.group(1))
                      else:
                          title_match = re.search(r'-\s*(\d{1,4})', raw_name)
                          if title_match:
                              card_num = int(title_match.group(1))
                              num_str = f"{card_num:03d}"

                      if num_str and num_str not in raw_name:
                          full_name = f"{raw_name} - {num_str}"
                      else:
                          full_name = raw_name

                      image_url = None
                      if image_tag:
                          image_url = image_tag.get("src") or image_tag.get("data-src")
                          if image_url and "data:image/gif" in image_url:
                              image_url = image_tag.get("data-src") or image_tag.get("srcset")

                      all_cards_list.append({
                          "name": full_name,
                          "marketPrice": price,
                          "imageUrl": image_url if (image_url and "data:image/gif" not in image_url) else None,
                          "card_num": card_num,
                          "product_link": product_link
                      })
                      matched_in_page += 1

                  print(f"Matched {matched_in_page} cards on page {page_number}.")

                  page_number += 1
                  time.sleep(1)

              browser.close()

          if all_cards_list:
              df = pd.DataFrame(all_cards_list)

              # Deduplicate by unique TCGplayer product link to preserve variants
              df = df.drop_duplicates(subset=["product_link"], keep="first")

              # Sort strictly by card number
              df = df.sort_values(by="card_num").drop(columns=["card_num", "product_link"])

              df.to_csv(CSV_FILENAME, index=False)
              print(f"✅ Successfully parsed, sorted, and saved {len(df)} total cards to {CSV_FILENAME}")
          else:
              print(f"!!! FAILED to parse any card data for this set.")
              exit(0)
          EOF

      - name: Download or generate card images
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          SET_URL_NAME: ${{ matrix.set.set_url_name }}
        run: |
          mkdir -p images
          python << 'EOF'
          import pandas as pd
          import requests
          import os
          import replicate

          set_url_name = os.environ.get('SET_URL_NAME')
          csv_file = f"{set_url_name}.csv"

          if not os.path.exists(csv_file):
              print(f"CSV file not found for {set_url_name}. Skipping image downloads.")
              exit(0)

          df = pd.read_csv(csv_file)
          client = replicate.Client(api_token=os.environ["REPLICATE_API_TOKEN"])

          for _, row in df.iterrows():
              card_name = row.get("name", "unknown").replace("/", "_").replace(" ", "_").replace(":", "")
              img_path = f"images/{set_url_name}-{card_name}.jpg"
              image_url = row.get("imageUrl")

              if os.path.exists(img_path):
                  continue

              if pd.notna(image_url):
                  try:
                      img_data = requests.get(image_url, timeout=15).content
                      with open(img_path, "wb") as f:
                          f.write(img_data)
                  except Exception as e:
                      print(f"Failed official image for {card_name}: {e}")
              else: 
                  print(f"Generating AI art for: {card_name}")
                  prompt = f"High quality digital painting of a Pokémon-style trading card featuring {row.get('name', 'a creature')}, full art, vibrant colors, no text, fantasy background, trading card art style"
                  try:
                      output = client.run(
                          "stability-ai/sdxl:39ed52f2a78e934b3ba6e2a89f5b1c712de7dfea535525255b1aa35c5565e08b",
                          input={"prompt": prompt, "width": 512, "height": 736}
                      )
                      img_data = requests.get(output[0], timeout=30).content
                      with open(img_path, "wb") as f:
                          f.write(img_data)
                  except Exception as e:
                      print(f"!!! AI generation failed for {card_name}: {e}")
          EOF

      - name: Generate printable PDF
        env:
          SET_URL_NAME: ${{ matrix.set.set_url_name }}
          SET_DISPLAY_NAME: ${{ matrix.set.set_display_name }}
        run: |
          python << 'EOF'
          import os
          import pandas as pd
          import re
          from fpdf import FPDF
          from datetime import datetime

          set_url_name = os.environ.get('SET_URL_NAME')
          set_display_name = os.environ.get('SET_DISPLAY_NAME')

          timestamp = datetime.now().strftime("%B %d, %Y at %I:%M %p EDT")
          csv_file = f"{set_url_name}.csv"
          pdf_filename = f"{set_url_name}_placeholders.pdf"
          pdf_title = f"Growlizard's {set_display_name} Print List"

          if not os.path.exists(csv_file):
              print(f"CSV file not found for {set_url_name}. Skipping PDF generation.")
              exit(0)

          df = pd.read_csv(csv_file)

          def get_card_num(card_name):
              if not isinstance(card_name, str):
                  return 999999
              match = re.search(r'-\s*(\d+)', card_name)
              if match:
                  return int(match.group(1))
              match = re.search(r'(\d+)', card_name)
              if match:
                  return int(match.group(1))
              return 999999

          df['card_num'] = df['name'].apply(get_card_num)
          df = df.sort_values(by='card_num').reset_index(drop=True)

          pdf = FPDF('P', 'mm', 'A4')
          pdf.set_auto_page_break(False)
          try: 
              pdf.add_font('Arial', '', '/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf', uni=True)
              pdf.add_font('Arial', 'B', '/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf', uni=True)
          except RuntimeError:
              print("Arial font not found, using helvetica.")

          card_w, card_h = 63, 88
          margin_x = 10
          margin_y = 30
          gap_x, gap_y = 5, 20

          card_data = []
          for index, row in df.iterrows():
              card_name_safe = row.get("name", "unknown").replace("/", "_").replace(" ", "_").replace(":", "")
              img_path = f"images/{set_url_name}-{card_name_safe}.jpg"

              card_data.append({
                  "name": row["name"],
                  "price": row.get("marketPrice"),
                  "path": img_path if os.path.exists(img_path) else None
              })

          for idx, card in enumerate(card_data):
              if idx % 6 == 0:
                  pdf.add_page()
                  try:
                      pdf.set_font("Arial", 'B', size=16)
                  except RuntimeError:
                      pdf.set_font("Helvetica", 'B', size=16)
                  pdf.set_xy(0, 10)
                  pdf.cell(0, 10, pdf_title, align='C')

                  try:
                      pdf.set_font("Arial", '', size=9)
                  except RuntimeError:
                      pdf.set_font("Helvetica", '', size=9)
                  pdf.set_xy(0, 18)
                  pdf.cell(0, 10, f"This is the current data as of {timestamp}", align='C')

              col = (idx % 3)
              row = ((idx % 6) // 3)
              x = margin_x + col * (card_w + gap_x)
              y = margin_y + row * (card_h + gap_y)

              if card["path"] and os.path.exists(card["path"]):
                  try:
                      pdf.image(card["path"], x, y, card_w, card_h)
                  except Exception as e:
                      print(f"Could not render image {card['path']}: {e}")
                      pdf.rect(x, y, card_w, card_h, 'D')
              else:
                  pdf.rect(x, y, card_w, card_h, 'D')

              pdf.set_draw_color(200, 200, 200)
              pdf.rect(x, y, card_w, card_h)

              name = card['name']
              price = card['price']
              price_text = f"Current Market Price:\n${price:.2f}" if isinstance(price, (int, float)) else "Price not available"

              try:
                  pdf.set_font("Arial", 'B', size=8)
              except RuntimeError:
                  pdf.set_font("Helvetica", 'B', size=8)
              pdf.set_text_color(0, 0, 0)
              pdf.set_xy(x, y + card_h + 2)
              pdf.multi_cell(card_w, 4, f"{name}", align='C')

              try:
                  pdf.set_font("Arial", 'B', size=8)
              except RuntimeError:
                  pdf.set_font("Helvetica", 'B', size=8)
              pdf.set_xy(x, y + card_h + 9)
              pdf.multi_cell(card_w, 4, f"{price_text}", align='C')

          os.makedirs("printables", exist_ok=True)
          pdf.output(f"printables/{pdf_filename}")
          EOF
      - name: Commit results
        run: |
          set_url_name=$(echo "${{ matrix.set.set_url_name }}")
          csv_file="${set_url_name}.csv"
          pdf_file="printables/${set_url_name}_placeholders.pdf"

          if [ ! -f "$csv_file" ]; then
            echo "No CSV found for ${set_url_name}, skipping commit."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add images/ "$csv_file" "$pdf_file"
          git commit -m "Update GrowliZard data for set: ${{ matrix.set.set_display_name }}" || echo "No changes to commit"

          # 10 attempts with an expanded random backoff window (3-12 seconds)
          for i in {1..10}; do
            echo "Attempting to sync and push, trial #$i..."
            if git pull --rebase && git push; then
              echo "Push successful!"
              exit 0
            fi
            echo "Push failed due to branch collision, waiting for delay..."
            sleep $((RANDOM % 10 + 3))
          done

          echo "::error::Could not push to remote repository after 10 attempts."
          exit 1
